
services:
  gateway:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - waf-modsecurity
      - web
    networks:
      - application_network

  waf-modsecurity:
    image: owasp/modsecurity-crs:4.25.1-nginx-lts
    restart: unless-stopped
    environment:
      BACKEND: "http://web:80"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "${MODSEC_RULE_ENGINE:-On}"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
    depends_on:
      - web
    networks:
      - application_network

  web:
    image: nginx:1.18-alpine
    restart: unless-stopped
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - application_network

  database:
    image: mysql:5.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "feedbackhub-local-root"
      MYSQL_DATABASE: "feedback"
      MYSQL_USER: "capybara"
      MYSQL_PASSWORD: "capybara"
    volumes:
      - ./db/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
      - db_data:/var/lib/mysql
    networks:
      - application_network

  php:
    build:
      context: ./php
      args:
        LOOPHOLE_VERSION: "1.0.0-beta.15"
        PLATFORM: "linux_64bit"
    image: feedback-app-v1-php-loophole:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: "database"
      DB_NAME: "feedback"
      DB_USER: "capybara"
      DB_PASS: "capybara"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - database
    networks:
      - application_network

  loophole:
    image: feedback-app-v1-php-loophole:local
    restart: on-failure
    profiles:
      - tunnel
    entrypoint: ["loophole"]
    command: ["http", "80", "--hostname", "lab-modsecurity"]
    network_mode: "service:gateway"
    depends_on:
      - gateway
    volumes:
      - ${HOME}/.loophole:/root/.loophole

networks:
  application_network:
    driver: bridge

volumes:
  db_data:

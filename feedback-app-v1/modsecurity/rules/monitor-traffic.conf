# Send normal application traffic to the ModSecurity audit log so the
# dashboard can display both legitimate requests and attacks.
#
# The WAF runs with SecAuditEngine RelevantOnly.  A rule with the "auditlog"
# action marks the transaction as relevant without blocking or adding an
# anomaly score.  Health checks (/healthz) and static assets are deliberately
# not matched, keeping the log small.
SecRule REQUEST_URI "@rx ^/(?:(?:index|login|dashboard|feedback_add|feedback_edit|feedback_delete|logout)\.php|report)(?:$|\?)" \
    "id:900001,\
    phase:1,\
    pass,\
    nolog,\
    msg:'Lab traffic monitored',\
    tag:'lab/monitor'"

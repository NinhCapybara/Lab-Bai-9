
global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend public_http
    bind :80
    default_backend website_route

backend website_route
    option httpchk
    http-check send meth GET uri /login.php ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    server waf waf-modsecurity:8080 check inter 3s fall 2 rise 2 resolvers docker init-addr none
    server web web:80 check inter 3s fall 2 rise 2 backup resolvers docker init-addr libc

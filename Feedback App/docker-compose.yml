version: "3.8"

services:
  waf:
    image: owasp/modsecurity-crs:4.25.1-nginx-lts
    restart: unless-stopped
    environment:
      BACKEND: "http://web:80"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
    ports:
      - "8080:8080"
    depends_on:
      - web
    networks:
      - application_network
  web:
    image: nginx:1.18-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - application_network
  db:
    image: mysql:5.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: feedback
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASS:-apppass}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    networks:
      - application_network

  php:
    build:
      context: ./php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: feedback
      DB_USER: ${DB_USER:-appuser}
      DB_PASS: ${DB_PASS:-apppass}
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - application_network

networks:
  application_network:
    driver: bridge

volumes:
  db_data:
